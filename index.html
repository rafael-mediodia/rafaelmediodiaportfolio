<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafael Mediodia</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cursor"></div>
    
    <div class="info-container">
        <!-- Sidebar content will be injected here -->
    </div>

    <main class="gallery-container">
        <div class="gallery" id="gallery">
            <!-- Projects will be injected here -->
        </div>
    </main>

    <!-- Safari video play overlay -->
    <div class="safari-play-overlay" id="safariPlayOverlay">
        <button class="safari-play-button">click to play videos for safari users!</button>
    </div>

    <!-- Safari play all button for homepage -->
    <button class="safari-play-all-button safari-play-all-thumbnails" id="safariPlayAllThumbnails" style="display: none;">PLAY ALL</button>

    <script src="cursor.js" defer></script>
    <script src="sidebar.js" defer></script>
    <script src="script.js" defer></script>
    <!-- motion.js loaded only when needed (on motion.html) -->
</body>
</html>
