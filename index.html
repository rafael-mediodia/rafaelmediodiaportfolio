<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rafael Mediodia</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preload" href="ABCArealVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
    
    <div class="info-container">
    </div>

    <div class="home-layout">
        <main class="gallery-container">
            <div class="home-view-filter" role="group" aria-label="Design layout">
                <button type="button" class="home-view-toggle" data-home-view="file" aria-pressed="true">File</button>
                <button type="button" class="home-view-toggle" data-home-view="scroll" aria-pressed="false">Scroll</button>
            </div>
            <div class="home-folder">
                <nav class="design-jump-nav" aria-label="Design projects" id="designJumpNav"></nav>
                <div class="gallery gallery--list" id="gallery">
                </div>
                <nav class="design-jump-nav design-jump-nav--bottom" aria-label="More design projects" id="designJumpNavBottom" hidden></nav>
            </div>
        </main>
    </div>

    <div class="video-zoom-modal" id="videoZoomModal">
        <div class="video-zoom-close" id="videoZoomClose"></div>
        <div class="video-zoom-container">
            <video id="zoomedVideo" controls></video>
        </div>
    </div>

    <div class="image-zoom-modal" id="imageZoomModal">
        <div class="image-zoom-close" id="imageZoomClose"></div>
        <div class="image-zoom-container">
            <img id="zoomedImage" alt="Illustration">
        </div>
    </div>

    <div class="safari-play-overlay" id="safariPlayOverlay">
        <button class="safari-play-button">click to play videos for safari users!</button>
    </div>

    <button class="safari-play-all-button safari-play-all-thumbnails" id="safariPlayAllThumbnails" style="display: none;">PLAY ALL</button>

    <script src="sidebar.js" defer></script>
    <script src="typefaces.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
