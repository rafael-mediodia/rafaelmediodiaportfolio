<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Providenceland - Rafael Mediodia</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="project-providence-page single-video-project">
    <div class="info-container">
        <!-- Sidebar content will be injected here -->
    </div>

    <div class="project-text-panel">
        <a href="../index.html" class="project-back-link">← back</a>
        <div class="project-header">
            <h1 class="project-title">Providenceland</h1>
            <div class="project-blurb">
                <p>Title card for Nora Guttman's film, Providenceland. The film follows two young knights on a quest for the King. I built the lettering out of clay, colored it in by hand, and animated it for the opening.</p>
            </div>
        </div>

        <div class="project-meta">
            <div class="project-meta-item">
                <div class="project-meta-label">Year</div>
                <div class="project-meta-value">2026</div>
            </div>
            <div class="project-meta-item">
                <div class="project-meta-label">Role</div>
                <div class="project-meta-value">Motion &amp; Lettering</div>
            </div>
            <div class="project-meta-item">
                <div class="project-meta-label">Type</div>
                <div class="project-meta-value">Title Card</div>
            </div>
        </div>
    </div>

    <div class="project-images-panel">
        <video data-src="../ProvidenceLand/ProvidenceLandTItleCard.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-modal-controls="true" data-caption="Final title card in motion." style="background: #111;"></video>
        <img data-src="../ProvidenceLand/FinalTitleCard_Still.png" alt="Providenceland final title card still" data-caption="Finished frame with the illuminated P, hand-colored florals, and blackletter wordmark.">

        <img data-src="../ProvidenceLand/ProvidencelandOptions.png" alt="Providenceland title explorations" data-caption="Early blackletter explorations for the title and Nora's credit.">

        <div class="project-portrait-row">
            <img data-src="../ProvidenceLand/FirstPass.png" alt="Providenceland clay letterforms, first pass" data-caption="Clay letterforms, first pass. Getting the material tone down before color and ornament.">
            <img data-src="../ProvidenceLand/SecondPass.png" alt="Providenceland clay letterforms, revised pass" data-caption="Second pass with a capital P and tighter spacing.">
        </div>

        <img data-src="../ProvidenceLand/OnceUponATimeHandlettering.png" alt="Once upon a time handlettering" data-caption="&quot;Once upon a time&quot; handlettering for the opening.">

        <img data-src="../ProvidenceLand/PR.png" alt="Providenceland clay material study" data-caption="Raw clay before digitizing and adding color.">
    </div>

    <div class="image-zoom-modal" id="imageZoomModal">
        <div class="image-zoom-close" id="imageZoomClose"></div>
        <div class="image-zoom-container">
            <img id="zoomedImage" alt="Project Image">
        </div>
    </div>

    <div class="video-zoom-modal" id="videoZoomModal">
        <div class="video-zoom-close" id="videoZoomClose"></div>
        <div class="video-zoom-container">
            <video id="zoomedVideo" muted loop playsinline webkit-playsinline></video>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videos = document.querySelectorAll('.project-images-panel video[data-src]');
            const images = document.querySelectorAll('.project-images-panel img[data-src]');
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    const video = entry.target;
                    const videoSrc = video.getAttribute('data-src');
                    if (!videoSrc) return;

                    video.src = videoSrc;
                    video.removeAttribute('data-src');

                    if (isSafari) {
                        video.preload = 'auto';
                    }
                    video.load();
                    video.addEventListener('loadeddata', () => {
                        video.play().catch(() => {});
                    }, { once: true });
                    videoObserver.unobserve(video);
                });
            }, { rootMargin: '100px' });

            const imageObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    const img = entry.target;
                    const src = img.getAttribute('data-src');
                    if (!src) return;
                    img.src = src;
                    img.removeAttribute('data-src');
                    imageObserver.unobserve(img);
                });
            }, { rootMargin: '100px' });

            videos.forEach((video) => videoObserver.observe(video));
            images.forEach((img) => imageObserver.observe(img));
        });
    </script>

    <script src="../sidebar.js" defer></script>
    <script src="../project-zoom.js" defer></script>
    <script src="../project-captions.js" defer></script>
</body>
</html>
