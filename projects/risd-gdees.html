<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISD GDee's</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .gdees-awards-slideshow {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
        }

        .gdees-awards-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.35s ease-in-out;
            pointer-events: none;
        }

        .gdees-awards-slide.gdees-awards-slide-active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    
    <div class="info-container">
        <!-- Sidebar content will be injected here -->
    </div>
    
    <div class="project-text-panel">
        <a href="../index.html" class="project-back-link">← back</a>
        <div class="project-header">
            <h1 class="project-title">RISD GDee's</h1>
            <div class="project-blurb">
                <p>Visual identity and motion for GDee's: RISD Graphic Design's inaugural on-screen showcase of student time-based work.</p>
                <p>Key art, motion, and promotional materials for the April screening in the GD Commons.</p>
            </div>
        </div>
        
        <div class="project-meta">
            <div class="project-meta-item">
                <div class="project-meta-label">Year</div>
                <div class="project-meta-value">2026</div>
            </div>
            <div class="project-meta-item">
                <div class="project-meta-label">Role</div>
                <div class="project-meta-value">Designer</div>
            </div>
            <div class="project-meta-item">
                <div class="project-meta-label">Client</div>
                <div class="project-meta-value">RISD Graphic Design</div>
            </div>
        </div>
        
        <div class="project-text-content">
            <div class="project-section">
                <div class="project-text">
                    <p>Set in Gal Gothic.</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="project-images-panel">
        <video data-src="../RISDGDee%27s/TheRISDGDee%27s_MainFeedPromo.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-modal-controls="true" data-caption="Primary Instagram feed loop to anchor the campaign and introduces the typographic motion language at full width."></video>
        <img data-src="../RISDGDee%27s/aArtboard%201_1.jpg" alt="RISD GDee's key art" data-caption="Adaptive logo for different video aspect ratios aiming to represent a sense of theater.">
        <video data-src="../RISDGDee%27s/16%20by%209%20reel.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-modal-controls="true" data-caption="16:9 motion reel for projection and shareable landscape cuts — the identity scaled to a cinematic frame."></video>
        <div class="project-portrait-row">
            <video class="project-video-portrait" data-src="../RISDGDee%27s/storyreel.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-modal-controls="true" data-caption="Portrait story reel — separate graphics and layouts built for the story format, not a crop or resize of the landscape work."></video>
            <video class="project-video-portrait" data-src="../RISDGDee%27s/AdMain-Story.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-modal-controls="true" data-caption="Story-format companion piece; tight vertical composition that pairs with the feed hero for a consistent social set."></video>
        </div>
        <video data-src="../RISDGDee%27s/GDEES_ONSCREEN_PRESHOW.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-modal-controls="true" data-caption="Campaign language extended into event space."></video>
        <video data-src="../RISDGDee%27s/NameCardReel.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-modal-controls="true" data-caption="Namecard animation system used to identify and credit each motion contributor across the screening package."></video>
        <video data-src="../RISDGDee%27s/RISDGDee%27s_Thumbnail.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-modal-controls="true" data-caption="Animated thumbnail treatment for digital listings and previews."></video>
        <div class="gdees-awards-slideshow" data-caption="3D award variations of the GDee's branding created by TypeShop Technician Ed Brown for participant giveaways.">
            <img class="gdees-awards-slide gdees-awards-slide-active" data-src="../RISDGDee%27s/GDee%27sAwards.png" alt="GDee's 3D awards by Ed Brown">
            <img class="gdees-awards-slide" data-src="../RISDGDee%27s/GDee%27sAwards_1.png" alt="GDee's 3D award variation one by Ed Brown">
            <img class="gdees-awards-slide" data-src="../RISDGDee%27s/GDee%27sAwards_2.png" alt="GDee's 3D award variation two by Ed Brown">
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videos = document.querySelectorAll('.project-images-panel video[data-src]');
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            
            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const video = entry.target;
                        const videoSrc = video.getAttribute('data-src');
                        if (!videoSrc) return;
                        
                        video.src = videoSrc;
                        video.removeAttribute('data-src');
                        
                        if (isSafari) {
                            video.preload = 'auto';
                            video.load();
                            const playVideo = () => {
                                video.play().catch(() => {});
                            };
                            if (video.readyState >= 3) {
                                playVideo();
                            } else {
                                video.addEventListener('canplaythrough', playVideo, { once: true });
                                video.addEventListener('loadeddata', playVideo, { once: true });
                            }
                        } else {
                            video.load();
                            video.addEventListener('loadeddata', () => {
                                video.play().catch(() => {});
                            }, { once: true });
                        }
                        
                        videoObserver.unobserve(video);
                    }
                });
            }, { rootMargin: '100px' });
            
            videos.forEach(video => videoObserver.observe(video));
            
            const images = document.querySelectorAll('.project-images-panel img[data-src]');
            const imageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (!img.hasAttribute('data-src')) return;
                        img.src = img.getAttribute('data-src');
                        img.removeAttribute('data-src');
                        imageObserver.unobserve(img);
                    }
                });
            }, { rootMargin: '100px' });
            
            images.forEach(img => imageObserver.observe(img));

            const awardsSlideshows = document.querySelectorAll('.gdees-awards-slideshow');
            awardsSlideshows.forEach((slideshow, slideshowIndex) => {
                const slides = slideshow.querySelectorAll('.gdees-awards-slide');
                if (slides.length <= 1) return;

                let currentSlideIndex = 0;
                let startDelayId = null;
                let intervalId = null;
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                function showNextSlide() {
                    slides[currentSlideIndex].classList.remove('gdees-awards-slide-active');
                    currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                    slides[currentSlideIndex].classList.add('gdees-awards-slide-active');
                }

                function startSlideshow() {
                    if (reduceMotion || startDelayId || intervalId) return;
                    startDelayId = setTimeout(() => {
                        startDelayId = null;
                        intervalId = setInterval(showNextSlide, 2200);
                    }, 1200 + slideshowIndex * 500);
                }

                function stopSlideshow() {
                    if (startDelayId) {
                        clearTimeout(startDelayId);
                        startDelayId = null;
                    }
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                }

                const slideshowObserver = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            startSlideshow();
                        } else {
                            stopSlideshow();
                        }
                    });
                }, { rootMargin: '60px', threshold: 0.1 });

                slideshowObserver.observe(slideshow);
            });
        });
    </script>
    
    <div class="image-zoom-modal" id="imageZoomModal">
        <div class="image-zoom-close" id="imageZoomClose"></div>
        <div class="image-zoom-container">
            <img id="zoomedImage" alt="Project Image">
        </div>
    </div>
    
    <div class="video-zoom-modal" id="videoZoomModal">
        <div class="video-zoom-close" id="videoZoomClose"></div>
        <div class="video-zoom-container">
            <video id="zoomedVideo" muted loop playsinline webkit-playsinline></video>
        </div>
    </div>
    
    <script src="../cursor.js" defer></script>
    <script src="../sidebar.js" defer></script>
    <script src="../project-zoom.js" defer></script>
    <script src="../project-captions.js" defer></script>
</body>
</html>
