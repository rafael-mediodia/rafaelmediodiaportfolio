<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Breakout Games - Rafael Mediodia</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preload" href="../ABCArealVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    
    <div class="info-container">
    </div>
    
    <div class="project-text-panel">
        <a href="../index.html" class="project-back-link">← back</a>
        <div class="project-header">
            <h1 class="project-title">Breakout Games</h1>
            <p class="project-blurb">
                Motion identity work for Breakout Escape Games focusing on discovery and exploration. Made during internship under Mediocre in Lexington, Kentucky.
            </p>
        </div>
        
        <ul class="project-meta">
            <li>2025</li>
            <li>Motion Designer</li>
            <li>Breakout Escape Games</li>
        </ul>
        
        <div class="project-text-content">
        </div>
    </div>
    
    <div class="project-images-panel">
        <video data-src="../Breakout/BreakoutMotion1.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-caption="Motion identity explorations inspired by the reveal of mysteries and secrets."></video>
        <video data-src="../Breakout/Breakout-Transition.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-caption="Transition animation sequence made for Breakout promotional materials."></video>
        <video data-src="../Breakout/breakout-motionreel.mp4" muted loop playsinline webkit-playsinline autoplay preload="metadata" data-caption="Motion reel compilation for web applications continuing the visual language of discovery and uncovering secrets."></video>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videos = document.querySelectorAll('.project-images-panel video[data-src]');
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            
            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const video = entry.target;
                        const videoSrc = video.getAttribute('data-src');
                        if (!videoSrc) return;
                        
                        video.src = videoSrc;
                        video.removeAttribute('data-src');
                        
                        if (isSafari) {
                            video.preload = 'metadata';
                            video.load();
                            
                            const playVideo = () => {
                                video.play().catch(() => {
                                });
                            };
                            
                            if (video.readyState >= 3) {
                                playVideo();
                            } else {
                                video.addEventListener('canplaythrough', playVideo, { once: true });
                                video.addEventListener('loadeddata', playVideo, { once: true });
                            }
                        } else {
                        video.load();
                            video.addEventListener('loadeddata', () => {
                                video.play().catch(() => {
                                    // Autoplay blocked
                                });
                            }, { once: true });
                        }
                        
                        videoObserver.unobserve(video);
                    }
                });
            }, { rootMargin: '100px' });
            
            videos.forEach(video => videoObserver.observe(video));
        });
    </script>
    <!-- Video Zoom Modal -->
    <div class="video-zoom-modal" id="videoZoomModal">
        <div class="video-zoom-close" id="videoZoomClose"></div>
        <div class="video-zoom-container">
            <video id="zoomedVideo" muted loop playsinline webkit-playsinline></video>
        </div>
    </div>
    
    <script src="../sidebar.js" defer></script>
    <script src="../project-zoom.js" defer></script>
    <script src="../project-captions.js" defer></script>
</body>
</html>
